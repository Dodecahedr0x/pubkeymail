version: '3.8'

services:
  # PostgreSQL Database with case-sensitive collation
  postgres:
    image: postgres:16-alpine
    container_name: pubkeymail-postgres
    environment:
      POSTGRES_DB: pubkeymail
      POSTGRES_USER: pubkeymail_user
      POSTGRES_PASSWORD: pubkeymail_dev_password
      # CRITICAL: Use C collation for case-sensitive string comparisons
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pubkeymail_user -d pubkeymail"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Redis for caching and rate limiting
  redis:
    image: redis:7-alpine
    container_name: pubkeymail-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # API Server (commented out until implementation is ready)
  # api:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #   container_name: pubkeymail-api
  #   environment:
  #     - NODE_ENV=development
  #     - DATABASE_URL=postgresql://pubkeymail_user:pubkeymail_dev_password@postgres:5432/pubkeymail
  #     - REDIS_URL=redis://redis:6379
  #   ports:
  #     - "3000:3000"
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy
  #   volumes:
  #     - ./src:/app/src
  #     - ./node_modules:/app/node_modules
  #   command: npm run dev
  #   restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  default:
    name: pubkeymail-network
